[[pages]]
id = "agent"
title = "Native SolarOS agent"
section = "app"
summary = "Configure and use the resumable LLM agent and its typed tools"
aliases = ["llm"]
keywords = "agent llm model openai responses reasoning tools policy prompt chat"
packages_any = ["app_agent"]
contract = """
Use `agent` for a resumable foreground conversation and `agent ask PROMPT` for
one request. Configure endpoint, model, key, reasoning, tool policy, and maximum
tools with `agent config`. `agent tools` reports the installed typed tools and
their policy disposition. The default `confirm` policy runs read-only tools and
requires local approval for sensitive, mutating, or disruptive calls. Ctrl+]
returns to the shell.
"""

[[pages]]
id = "python.gfx"
title = "Python graphics API"
section = "api"
summary = "Draw through SolarOS displays from MicroPython"
aliases = ["py.gfx"]
keywords = "python py gfx graphics display screen draw pixel line rectangle circle font oled lcd framebuffer present"
packages_any = ["app_python"]
contract = """
Python: import solaros; from solaros import gfx. gfx.begin() uses the current
foreground display and raises RuntimeError from a port/headless shell where
there is none. For an attached display, the agent must call display_list and
pass a returned ready name to gfx.begin(name); scripts can verify names with
solaros.expansion.devices(). An absent name raises ESP_ERR_NOT_FOUND. Use
width(), height(), or size(); clear(color); color(color); pixel, line, rect,
fill_rect, circle, fill_circle, text; refresh() or present(); then end().
Standard min() and max() are available. Colors are gfx.WHITE, gfx.LIGHT,
gfx.DARK, gfx.BLACK, and gfx.gray(level); pass these constants to clear() and
color(), never color-name strings or guessed integers. Required
attached-display pattern (replace the quoted target with a ready display_list
name):
import solaros
from solaros import gfx
gfx.begin("verified-ready-target")
try:
    gfx.clear(gfx.WHITE)
    gfx.color(gfx.BLACK)
    # draw here
    gfx.present()
finally:
    gfx.end()
"""

[[pages]]
id = "lua.gfx"
title = "Lua graphics API"
section = "api"
summary = "Draw through SolarOS displays from Lua"
aliases = []
keywords = "lua gfx graphics display screen draw pixel line rectangle circle font oled lcd framebuffer present"
packages_any = ["app_lua"]
contract = """
Lua: use the preloaded solaros table or local solaros = require("solaros"),
then assign local gfx = solaros.gfx. gfx.begin() uses the current foreground
display and errors from a port/headless shell where there is none. For an
attached display, the agent must call display_list and pass a returned ready
name; absent names raise ESP_ERR_NOT_FOUND. Use width, height or size; clear;
color; pixel, line, rect, fill_rect, circle, fill_circle, text; refresh or
present. Colors are gfx.WHITE, gfx.LIGHT, gfx.DARK, gfx.BLACK, and
gfx.gray(level); pass these constants to clear and color, never color-name
strings or guessed integers. Call gfx["end"]() because end is a Lua keyword.
Required attached-display pattern (replace the quoted target with a ready
display_list name):
local solaros = require("solaros")
local gfx = solaros.gfx
gfx.begin("verified-ready-target")
local ok, err = pcall(function()
    gfx.clear(gfx.WHITE)
    gfx.color(gfx.BLACK)
    -- draw here
    gfx.present()
end)
gfx["end"]()
if not ok then error(err) end
"""

[[pages]]
id = "python.tui"
title = "Python text user-interface API"
section = "api"
summary = "Build terminal applications from MicroPython"
aliases = ["py.tui"]
keywords = "python py tui terminal text interface curses keyboard keys input box bold inverse"
packages_any = ["app_python"]
contract = """
Python: from solaros import tui. Functions are rows, cols, size, clear, refresh,
move, write, addstr, putch, hline, vline, vrule, box, fill, and getch.
Attributes are NORMAL, BOLD, INVERSE; key constants include KEY_ESCAPE and
navigation keys. Loop while not solaros.should_exit() for an interactive
foreground app.
"""

