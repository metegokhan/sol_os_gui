[[pages]]
id = "storage"
title = "Storage and shell paths"
section = "service"
summary = "Use SolarOS volumes, files, directories, and shell-style paths"
aliases = ["filesystem", "files"]
keywords = "python lua storage filesystem files directories mount sd flash copy rename remove mkdir path disk volume"
contract = """
Use solaros.storage, not host os or io APIs. Functions include status,
is_mounted, mount, unmount, mount_point, usage, resolve, rescan, blocks,
block_count, block, usage_for_block, mkdir, rmdir, remove, rename, copy,
mount_volume, and unmount_volume. SolarOS shell paths use slash for the active
default storage volume.
"""

[[pages]]
id = "identity"
title = "Device identity"
section = "service"
summary = "Read and configure the NVS-backed user and hostname"
aliases = ["hostname", "user"]
keywords = "python lua identity hostname user username nvs wifi advertised device name"
contract = """
solaros.identity provides user(), hostname(), set_user(name),
set_hostname(name), and format(). Values are NVS-backed. Reboot before
expecting an already initialized Wi-Fi interface to advertise a changed
hostname.
"""

[[pages]]
id = "jobs"
title = "Background jobs"
section = "service"
summary = "Inspect and control bounded background workers"
aliases = ["job", "background"]
keywords = "python lua jobs background task process start stop state waiting failed memory stack"
contract = """
solaros.jobs provides list(), count(), status(name), start(name,
optional_args), and stop(name). Status includes state, last_error,
worker_stack_bytes, worker_stack_external, tick timing, and deadline telemetry.
Waiting means launch admission has not yet succeeded; failed records a terminal
launch or runtime error.
"""

[[pages]]
id = "sessions.apps"
title = "Foreground sessions and applications"
section = "service"
summary = "Create shells and inspect resumable foreground applications"
aliases = ["sessions", "apps"]
keywords = "python lua sessions apps shell port terminal create close registry foreground"
contract = """
solaros.sessions.create_shell(port, optional term, cols, rows) returns a
session id; close(id) closes it. Script-created port shells do not run
/.shell/startup. solaros.apps.list() and find(name) inspect registered
foreground apps.
"""

[[pages]]
id = "network"
title = "Wi-Fi, MQTT, and network APIs"
section = "api"
summary = "Connect, inspect, and communicate over installed network services"
aliases = ["wifi", "mqtt", "net"]
keywords = "python lua wifi wireless station access point ap nat scan connect mqtt network ping"
packages_any = ["service_wifi", "service_mqtt", "service_net"]
contract = """
solaros.wifi provides status, status_text, start, stop, connect, connect_saved,
disconnect, forget, forget_ssid, forget_all, known, scan, ap_start, ap_stop,
and nat. solaros.mqtt provides status, connect, disconnect, publish, subscribe,
and read. solaros.net.ping(host, optional count, timeout_ms, interval_ms,
data_size) returns statistics. These modules are package-gated.
"""

[[pages]]
id = "gpio.analog"
title = "GPIO, ADC, PWM, and LED APIs"
section = "api"
summary = "Use runtime-safe digital and analog expansion pins"
aliases = ["gpio", "adc", "pwm"]
keywords = "python lua gpio pin digital led adc analog pwm input output pull read write voltage duty"
packages_any = ["service_gpio", "service_adc", "service_pwm"]
contract = """
Inspect solaros.gpio.pins() and allowed(pin) before use; never invent safe GPIO
numbers. GPIO offers mode or configure, read, write, and release plus INPUT,
OUTPUT and pull constants. solaros.led offers status, set, on, off, toggle.
solaros.adc offers pins and read. solaros.pwm offers status, set(pin,
frequency, duty_percent), and off. APIs are package-gated.
"""

[[pages]]
id = "buses"
title = "Named runtime buses"
section = "api"
summary = "Create and use resource-owned I2C, SPI, UART, and OneWire buses"
aliases = ["bus"]
keywords = "python lua buses resource named bus create attach detach i2c spi uart onewire lease"
packages_any = ["service_resources"]
contract = """
Prefer solaros.buses for named hardware. list and get inspect registered buses;
create_i2c, create_onewire, create_spi, and create_uart create runtime buses;
attach, detach, remove manage lifecycle. Transfer families are i2c_probe or
scan or read_reg or write_reg, onewire_reset or scan or xfer, spi_xfer or read
or write, and uart_read or write. Inspect descriptors before choosing names,
pins, chip selects, or hosts.
"""

[[pages]]
id = "compatibility.io"
title = "Compatibility I/O modules"
section = "api"
summary = "Use the legacy single-bus I2C, SPI, UART, and OneWire APIs"
aliases = ["i2c", "spi", "uart", "onewire"]
keywords = "python lua i2c spi uart onewire serial transfer register probe scan compatibility"
packages_any = ["service_i2c", "service_spi", "service_uart", "service_onewire"]
contract = """
Compatibility modules are solaros.i2c info, probe, scan, read_reg, write_reg;
solaros.spi status, xfer, read, write; solaros.uart status, baud,
is_valid_baud, mode, write, read; solaros.onewire allowed, reset, scan, xfer.
Inspect status or allowed first. New multi-bus code should prefer
solaros.buses. Modules are package-gated.
"""

[[pages]]
id = "expansion"
title = "Expansion drivers and attached devices"
section = "service"
summary = "Discover, attach, and detach package-gated expansion devices"
aliases = ["devices", "drivers"]
keywords = "python lua expansion device driver attach detach bindings display oled lcd sensor peripheral"
packages_any = ["service_expansion"]
contract = """
solaros.expansion.drivers() lists compiled drivers and devices() lists
currently attached devices with normalized bindings. attach(driver, name,
bindings) and detach(name) manage them. Never assume an example name such as
lcd0 or oled0 exists; inspect devices() or use a name explicitly supplied by
the user.
"""

