name: Build Waveshare ESP32-S3-RLCD-4.2

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build-board.yml
    with:
      environment: waveshare_esp32_s3_rlcd_4_2
