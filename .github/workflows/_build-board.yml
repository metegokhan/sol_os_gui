name: Build board

on:
  workflow_call:
    inputs:
      environment:
        description: PlatformIO environment to validate and build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out SolarOS
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Validate board metadata and documentation
        run: python scripts/validate_board_metadata.py --board "${{ inputs.environment }}"

      - name: Build full firmware
        run: pio run --environment "${{ inputs.environment }}"
        env:
          SOLAR_OS_FLAVOR: full
